<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eloquix Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-circle">
          <svg class="logo-sparkle" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
            <defs>
              <linearGradient id="geminiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#a1a1aa" />
              </linearGradient>
            </defs>
            <path d="M12 3c.132 0 .263 0 .393.007a7.5 7.5 0 0 0 7.92 7.92c.11.002.22.003.33.003a.75.75 0 0 1 0 1.5c-.11 0-.22 0-.33.003a7.5 7.5 0 0 0-7.92 7.92c-.007.13-.007.261-.007.391a.75.75 0 0 1-1.5 0c0-.13 0-.261-.007-.391a7.5 7.5 0 0 0-7.92-7.92C2.86 12.44 2.75 12.43 2.64 12.43a.75.75 0 0 1 0-1.5c.11 0 .22-.001.33-.003a7.5 7.5 0 0 0 7.92-7.92C10.9 3.004 11.03 3 11.16 3a.75.75 0 0 1 .84 0Z" fill="url(#geminiGradient)"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Eloquix</h1>
          <p>Comment Companion</p>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">Checking...</div>
    </header>

    <!-- Account & Subscription Card -->
    <div class="account-card" id="accountCard">
      <div class="account-header">
        <div class="user-profile">
          <span class="user-email" id="userEmail">Guest User</span>
          <button type="button" class="logout-btn" id="logoutBtn" style="display: none;">Sign out</button>
        </div>
        <span class="plan-pill" id="planPill">FREE PLAN</span>
      </div>

      <!-- Google Sign In Button -->
      <button type="button" class="google-login-btn" id="googleLoginBtn">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Quota Bar -->
      <div class="quota-bar-container">
        <div class="quota-text">
          <span>Daily Quota</span>
          <span id="quotaText">0 / 2 used</span>
        </div>
        <div class="quota-progress-bg">
          <div class="quota-progress-fill" id="quotaFill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Upgrade Buttons -->
      <div class="upgrade-action-row" id="upgradeRow">
        <a href="https://rzp.io/rzp/YJ677Vl" target="_blank" class="upgrade-btn pro-btn" id="proBtn">
          ⚡ Upgrade Pro (₹49/mo)
        </a>
        <a href="https://rzp.io/rzp/Oyz6stR" target="_blank" class="upgrade-btn ultra-btn" id="ultraBtn">
          🚀 Upgrade Ultra (₹99/mo)
        </a>
      </div>
    </div>

    <!-- Main Settings Form Container -->
    <div class="double-bezel-outer">
      <main class="app-main">
        <form id="settingsForm">
          
          <!-- Default Tone Selection -->
          <div class="form-group">
            <label for="toneSelect">Default Comment Tone</label>
            <div class="select-wrapper">
              <select id="toneSelect">
                <option value="insightful" selected>Insightful 💡</option>
                <option value="supportive">Supportive 🤝</option>
                <option value="constructive">Constructive 🛠️</option>
                <option value="funny">Funny 😄</option>
                <option value="questioning">Questioning ❓</option>
              </select>
            </div>
          </div>

          <!-- Custom Context / Writing Style -->
          <div class="form-group">
            <label for="customInstructions">Your Persona & Writing Style</label>
            <textarea id="customInstructions" rows="3" placeholder="e.g. 'Software Engineer. Focus on performance, security, and developer productivity.'"></textarea>
          </div>

          <!-- Backend Server URL Config (Advanced) -->
          <div class="form-group">
            <label for="backendUrlInput">Backend Server URL</label>
            <div class="input-wrapper">
              <input type="text" id="backendUrlInput" value="http://localhost:5000" placeholder="http://localhost:5000">
            </div>
          </div>

          <!-- Save Button -->
          <button type="submit" class="save-button" id="saveBtn">
            <span>Save Preferences</span>
          </button>

        </form>
      </main>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Securely powered by Eloquix API Server.</p>
    </footer>
  </div>
  <script src="../config.js"></script>
  <script src="../firebase-db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
