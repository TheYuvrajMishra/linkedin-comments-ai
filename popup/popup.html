<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Comment Generator Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-glow"></div>
        <div class="logo-circle">
          <span class="logo-icon">✨</span>
        </div>
        <div class="logo-text">
          <h1>LinkAI</h1>
          <p>Comment Companion</p>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">Connected</div>
    </header>

    <!-- Main Settings Form -->
    <main class="app-main">
      <form id="settingsForm">
        
        <!-- API Key Field -->
        <div class="form-group">
          <div class="label-row">
            <label for="apiKey">Groq API Key</label>
            <a href="https://console.groq.com/keys" target="_blank" class="helper-link">Get Key <span class="arrow">↗</span></a>
          </div>
          <div class="input-wrapper">
            <input type="password" id="apiKey" placeholder="gsk_..." required autocomplete="off">
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Show API Key">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Model Selection -->
        <div class="form-row">
          <div class="form-group half-width">
            <label for="modelSelect">LLM Model</label>
            <div class="select-wrapper">
              <select id="modelSelect">
                <option value="llama-3.1-8b-instant" selected>Llama 3.1 8B (Fast)</option>
                <option value="mixtral-8x7b-32768">Mixtral 8x7B (Deep)</option>
                <option value="llama-3.3-70b-versatile">Llama 3.3 70B (High Quality)</option>
                <option value="gemma2-9b-it">Gemma 2 9B</option>
              </select>
            </div>
          </div>

          <!-- Default Tone Selection -->
          <div class="form-group half-width">
            <label for="toneSelect">Default Tone</label>
            <div class="select-wrapper">
              <select id="toneSelect">
                <option value="insightful" selected>Insightful</option>
                <option value="supportive">Supportive</option>
                <option value="constructive">Constructive</option>
                <option value="funny">Funny</option>
                <option value="questioning">Questioning</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Custom Context / Instructions -->
        <div class="form-group">
          <label for="customInstructions">Your Context / Writing Style</label>
          <textarea id="customInstructions" rows="3" placeholder="e.g. 'I am a senior frontend engineer. Focus comments on tech stacks, UX, and clean architecture. Speak concisely.'"></textarea>
          <div class="character-counter">Helps customize comments to match your professional background</div>
        </div>

        <!-- Save Button -->
        <button type="submit" class="save-button" id="saveBtn">
          <span>Save Preferences</span>
          <div class="btn-glow"></div>
        </button>

      </form>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Your API keys are stored locally in your browser storage.</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
