<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eloquix Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-circle">
          <svg class="logo-sparkle" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
            <defs>
              <linearGradient id="geminiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#a1a1aa" />
              </linearGradient>
            </defs>
            <path d="M12 3c.132 0 .263 0 .393.007a7.5 7.5 0 0 0 7.92 7.92c.11.002.22.003.33.003a.75.75 0 0 1 0 1.5c-.11 0-.22 0-.33.003a7.5 7.5 0 0 0-7.92 7.92c-.007.13-.007.261-.007.391a.75.75 0 0 1-1.5 0c0-.13 0-.261-.007-.391a7.5 7.5 0 0 0-7.92-7.92C2.86 12.44 2.75 12.43 2.64 12.43a.75.75 0 0 1 0-1.5c.11 0 .22-.001.33-.003a7.5 7.5 0 0 0 7.92-7.92C10.9 3.004 11.03 3 11.16 3a.75.75 0 0 1 .84 0Z" fill="url(#geminiGradient)"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Eloquix</h1>
          <p>Comment Companion</p>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">Checking...</div>
    </header>

    <!-- Account & Subscription Card -->
    <div class="account-card" id="accountCard">
      <div class="account-header">
        <div class="user-profile">
          <span class="user-email" id="userEmail">Guest User</span>
        </div>
        <span class="plan-pill" id="planPill">FREE PLAN</span>
      </div>

      <!-- Companion Website Auth Portal Link -->
      <button type="button" class="google-login-btn" id="webAuthBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span id="webAuthBtnText">Open Companion Auth Center</span>
      </button>

      <!-- Quota Bar -->
      <div class="quota-bar-container">
        <div class="quota-text">
          <span>Daily Quota</span>
          <span id="quotaText">0 / 2 used</span>
        </div>
        <div class="quota-progress-bg">
          <div class="quota-progress-fill" id="quotaFill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Upgrade Web Portal Redirection Button -->
      <div class="upgrade-action-row" id="upgradeRow">
        <button type="button" class="upgrade-btn pro-btn" id="portalSubBtn" style="width: 100%; display: flex; items-center: center; justify-content: center; text-align: center; cursor: pointer;">
          ⚡ Upgrade Subscription on Web Portal &rarr;
        </button>
      </div>
    </div>

    <!-- Main Settings Form Container -->
    <div class="double-bezel-outer">
      <main class="app-main">
        <form id="settingsForm">
          
          <!-- Default Tone Selection -->
          <div class="form-group">
            <label for="toneSelect">Default Comment Tone</label>
            <div class="select-wrapper">
              <select id="toneSelect">
                <option value="insightful" selected>Insightful 💡</option>
                <option value="supportive">Supportive 🤝</option>
                <option value="constructive">Constructive 🛠️</option>
                <option value="funny">Funny 😄</option>
                <option value="questioning">Questioning ❓</option>
              </select>
            </div>
          </div>

          <!-- Custom Context / Writing Style -->
          <div class="form-group">
            <label for="customInstructions">Your Persona & Writing Style</label>
            <textarea id="customInstructions" rows="3" placeholder="e.g. 'Software Engineer. Focus on performance, security, and developer productivity.'"></textarea>
          </div>


          <!-- Save Button -->
          <button type="submit" class="save-button" id="saveBtn">
            <span>Save Preferences</span>
          </button>

        </form>
      </main>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Securely powered by Eloquix API Server.</p>
    </footer>
  </div>
  <script src="../config.js"></script>
  <script src="../firebase-db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
